<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>木取り判断 | 林材木店</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235a7a3e'/><text x='51' y='46.5' font-size='68' text-anchor='middle' dominant-baseline='central' fill='%23ffffff' font-family='sans-serif' font-weight='bold'>木</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235a7a3e'/><text x='51' y='46.5' font-size='68' text-anchor='middle' dominant-baseline='central' fill='%23ffffff' font-family='sans-serif' font-weight='bold'>木</text></svg>">
<meta name="theme-color" content="#5a7a3e">
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#2c2a26; --sub:#7a756c; --line:#e3ddd0;
    --accent:#5a7a3e; --accent2:#7a9a55; --shadow:0 1px 3px rgba(60,45,25,.08),0 6px 20px rgba(60,45,25,.06);
    --buy:#c0392b; --buy-bg:rgba(192,57,43,.06); --warn:#b7791f; --ok:#1e8e4e; --pos:#1c66c4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1a17; --card:#26231f; --ink:#ece7dd; --sub:#9c958a; --line:#3a352e;
      --accent:#9dbb72; --accent2:#7a9a55; --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
      --buy:#e57368; --buy-bg:rgba(229,115,104,.10); --warn:#e0b25e; --ok:#7fce9e; --pos:#6fb1f5;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:0 0 60px}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
  .head-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .logo{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;box-shadow:var(--shadow)}
  h1{font-size:17px;font-weight:800;line-height:1.2}
  .hsub{font-size:11px;color:var(--sub);margin-top:2px}
  .spacer{margin-left:auto}
  .tbtn{font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
  .tbtn:hover{border-color:var(--accent)}
  .chbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #upd{font-size:12px;color:var(--sub);font-weight:700}
  main{max-width:1200px;margin:0 auto;padding:16px 20px}
  .prem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:14px;font-size:13px;line-height:1.8}
  .prem .l{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
  .pcard.v-good{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
  .pcard.v-bad{border-color:color-mix(in srgb,var(--buy) 45%,transparent);background:var(--buy-bg)}
  .pcard h3{font-size:14.5px;font-weight:800;line-height:1.35}
  .badge{display:inline-block;font-weight:800;font-size:13px;padding:2px 10px;border-radius:8px;color:#fff}
  .be{display:flex;align-items:baseline;gap:8px;margin:2px 0}
  .be .big{font-size:30px;font-weight:800;line-height:1}
  .be .unit{font-size:12px;color:var(--sub);font-weight:700}
  .be .sub{font-size:13px;color:var(--sub);font-weight:700}
  .row{font-size:12.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 12px}
  .row b{color:var(--ink)}
  .yt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
  .yt th{color:var(--sub);font-weight:700;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);font-size:11px}
  .yt td{padding:4px 6px;text-align:right;border-top:1px solid var(--line)}
  .yt th:first-child,.yt td:first-child{text-align:left}
  details.det{font-size:12px}
  details.det summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:12px;list-style:none}
  details.det summary::-webkit-details-marker{display:none}
  .stt{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;white-space:nowrap}
  .pactions{display:flex;gap:8px;margin-top:2px}
  .note{font-size:12px;color:var(--sub);margin:16px 2px;line-height:1.7}
  .note li{margin:3px 0 3px 18px}
  .empty{padding:50px 20px;text-align:center;color:var(--sub);font-weight:700}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
  .panel h2{font-size:14px;font-weight:800;margin-bottom:10px}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .fgrid label{font-size:11.5px;color:var(--sub);font-weight:700;display:flex;flex-direction:column;gap:3px}
  .fgrid input{font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .pedit{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .pedit .prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .pedit .prow input{font-size:13px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:70px}
  .pedit .prow input.lbl{width:auto;flex:1;min-width:180px}
  /* 判断一覧テーブル */
  .dtblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px}
  .dtblhd{font-size:14px;font-weight:800;padding:12px 16px 4px}
  .dtbl{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  .dtbl th{position:sticky;top:0;z-index:2;background:var(--card);color:var(--sub);font-weight:700;text-align:right;padding:9px 10px;border-bottom:2px solid var(--line);font-size:11.5px}
  .dtbl td{padding:9px 10px;text-align:right;border-top:1px solid var(--line)}
  .dtbl th:first-child,.dtbl td:first-child,.dtbl th.tl,.dtbl td.tl{text-align:left}
  .dtbl .floor{font-weight:800;font-size:15px;color:var(--pos)}
  .dtbl .mg{font-weight:800}
  .badge-sm{display:inline-block;font-weight:800;font-size:11.5px;padding:1px 8px;border-radius:7px;color:#fff}
  .floorline{font-size:12.5px;font-weight:700;color:var(--pos);background:color-mix(in srgb,var(--pos) 8%,transparent);border-radius:8px;padding:6px 9px;margin:2px 0}
  .plabel{color:var(--sub);font-size:10px;font-weight:700;margin-left:4px}
  @media (max-width:700px){ .head-inner{padding:10px 14px} main{padding:12px 14px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header><div class="head-inner">
  <div class="logo">木</div>
  <div><h1>木取り判断ツール</h1><div class="hsub">4m原板を短尺化する木取りの損益分岐手間賃・判定</div></div>
  <div class="spacer"></div>
  <span id="chSeg">
    <button class="tbtn chbtn" data-ch="標準">標準</button>
    <button class="tbtn chbtn" data-ch="市売">市売</button>
    <button class="tbtn chbtn" data-ch="付売">付売</button>
    <button class="tbtn chbtn" data-ch="EC">EC</button>
  </span>
  <span id="upd"></span>
  <button id="refreshBtn" class="tbtn">🔄 再計算</button>
  <button id="cfgBtn" class="tbtn">⚙ 設定</button>
  <a class="tbtn" href="tekisei.html">← 適正在庫へ</a>
</div></header>
<main>
  <div id="cfgPanel" style="display:none"></div>
  <div id="content"><div class="empty">読み込み中…</div></div>
</main>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxvPjDv81vrJMW2GaqpCJooyxxt7__gvMF4mJkmcGNbNS2xGMoXgTnn6_OEPZ3Rr0spdg/exec";
const CRED_KEY='hayazai_board_cred', KD_CACHE='hayazai_kidori_cache', CH_KEY='hayazai_kidori_ch';
// 共通SSO: 他ツールのログインを引き継ぐ（読みだけ・kidoriはログインフォーム無し）
const SSO_KEY='hayazai_sso_cred';
const SSO_PEERS=['hayazai_board_cred','hayazai_seiso_cred','hayazai_rulebook_cred','hayazai_kaizen_cred','notify_creds_v1','seinodesk_cred','faxdesk_cred','orderdesk_cred','nippou_cred'];
function ssoFind_(){ const keys=[SSO_KEY].concat(SSO_PEERS); for(const k of keys){ try{ const v=JSON.parse(localStorage.getItem(k)||'null'); if(v){ const email=v.email||v.e, pass=v.pass||v.p; if(email&&pass) return {email:String(email),pass:String(pass)}; } }catch(e){} } return null; }
function creds(){ try{ const v=JSON.parse(localStorage.getItem(CRED_KEY)||sessionStorage.getItem(CRED_KEY)||'null'); if(v&&v.email&&v.pass) return v; }catch(e){} const s=ssoFind_(); if(s) return s; return {}; }
function authQS(){ const c=creds(); return 'email='+encodeURIComponent(c.email||'')+'&pass='+encodeURIComponent(c.pass||''); }
let KD=null, CFG_OPEN=false;
// 既定=標準。未設定or旧既定'市売'は標準へ移行。付売/ECを明示選択済みならそのまま
let CH=localStorage.getItem(CH_KEY); if(!CH||CH==='市売') CH='標準';
function chCacheKey(){ return KD_CACHE+'_'+CH; }
function markChSeg(){ document.querySelectorAll('.chbtn').forEach(b=>b.classList.toggle('on', b.dataset.ch===CH)); }
const VD={ '◎':{c:'var(--ok)',t:'◎ 積極的に切る'}, '○':{c:'var(--pos)',t:'○ 切る価値あり'}, '△':{c:'var(--warn)',t:'△ 条件つき'}, '×':{c:'var(--buy)',t:'× 切らない'} };
const STT={ buy:{c:'var(--buy)',bg:'rgba(192,57,43,.12)',t:'要購入'}, soon:{c:'var(--warn)',bg:'rgba(183,121,31,.12)',t:'まもなく不足'}, recover:{c:'var(--warn)',bg:'rgba(183,121,31,.10)',t:'回復見込'}, over:{c:'var(--warn)',bg:'rgba(183,121,31,.10)',t:'積み上がり'}, ok:{c:'var(--ok)',bg:'rgba(30,142,78,.10)',t:'充足'}, idle:{c:'var(--sub)',bg:'rgba(120,110,100,.10)',t:'動きなし'}, none:{c:'var(--sub)',bg:'rgba(120,110,100,.10)',t:'—'} };
function esc(s){ return String(s==null?'':s).replace(/</g,'&lt;'); }
function yen(v){ return Number(v||0).toLocaleString('ja-JP'); }
// 余裕%の色分け（50%超=緑 / 20-50%=橙 / 20%未満=赤）
function mgColor(m){ if(m==null) return 'var(--sub)'; if(m>50) return 'var(--ok)'; if(m>=20) return 'var(--warn)'; return 'var(--buy)'; }

// GASは時々302→HTML(一時応答)や遅延あり。タイムアウト付き＋JSON判定で1回掴む（index.htmlのfetchBoardOnce踏襲）
async function fetchKdRaw(ch,force,timeoutMs){
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(), timeoutMs||16000);
  try{
    const r=await fetch(GAS_URL+'?api=kidori&method='+encodeURIComponent(ch)+'&'+authQS()+(force?'&fresh=1':''),{method:'GET',signal:ctrl.signal});
    const t=await r.text();
    if(!t || t.trim().charAt(0)!=='{') throw new Error('応答が不正（Googleの一時応答）');
    return JSON.parse(t);
  } finally { clearTimeout(to); }
}
// 進捗メッセージ（読込中のempty要素があれば経過で更新）
let loadTimer=null;
function setLoadMsg(msg){ const el=document.querySelector('#content .empty'); if(el) el.innerHTML=msg; }
function startLoadProgress(){ stopLoadProgress(); loadTimer=setTimeout(()=>setLoadMsg('サーバー起動中…最大30秒かかることがあります'),5000); }
function stopLoadProgress(){ if(loadTimer){ clearTimeout(loadTimer); loadTimer=null; } }
// 初回25秒(コールド対応)→以降12秒。一時応答/失敗は最大3回まで自動リトライ
async function fetchKd(force){
  const ch=CH;
  let j=null, lastErr=null;
  for(let attempt=0; attempt<3 && !j; attempt++){
    if(attempt>0) setLoadMsg('再試行中('+(attempt+1)+'/3)…');
    try{
      const r=await fetchKdRaw(ch,force,attempt===0?25000:12000);
      if(ch!==CH) throw new Error('切替のため破棄');
      if(r&&r.ok&&r.patterns){ j=r; }
      else if(r&&r.error==='unauthorized'){ lastErr=new Error('ログイン情報が失効しました。在庫ボードで入り直してください'); break; }
      else lastErr=new Error((r&&r.error)||'取得失敗');
    }catch(e){ if(ch!==CH) throw e; lastErr=e; }
  }
  if(!j) throw lastErr||new Error('取得失敗');
  KD=j; try{localStorage.setItem(chCacheKey(),JSON.stringify(j));}catch(e){} return j;
}
function sttChip(s){ const o=STT[s]||STT.none; return '<span class="stt" style="color:'+o.c+';background:'+o.bg+'">'+o.t+'</span>'; }

function render(){
  const d=KD; if(!d) return;
  document.getElementById('upd').textContent='更新 '+(d.updated||'');
  markChSeg();
  const s=d.srcSummary||{}, st=d.settings||{};
  const so=STT[s.status]||STT.none;
  let h='';
  // 前提カード
  h+='<div class="prem"><div class="l">📐 前提（元板 4m丸節）</div>'
    +'元板 <b>4m丸節</b>：販売可能 <b>'+yen(s.availBundles)+'束</b>（適正 '+yen(s.teki)+'束）'+sttChip(s.status)
    +'　→ 評価額 <b>'+yen(s.srcValue)+'円/枚</b>（'+esc(s.srcValueMode)+'・原価'+yen(s.cost)+'円）<br>'
    +'<span style="font-size:12px;color:var(--sub)">チャネル <b>'+esc(d.method)+'</b>（手数料 '+(Math.round((d.feeRate||0)*1000)/10)+'%）'
    +'　損益分岐手間賃＝この評価額を上回る産出手取りの余剰（円/枚＝円/カット、元板1枚=1カット）</span></div>';
  // 判断一覧テーブル（本丸）: 分岐販売価格＝これ以上で売れるなら切ってOK
  h+='<div class="dtblwrap"><div class="dtblhd">📋 判断一覧　<span style="font-size:11.5px;color:var(--sub);font-weight:700">分岐販売価格＝キー産出品がこの束単価以上で売れるなら切ってOK（現在価格からの下落余裕%つき）</span></div>';
  h+='<table class="dtbl"><thead><tr>'
    +'<th class="tl">パターン</th><th class="tl">判定</th><th>損益分岐手間賃<br><span style="font-weight:400">円/枚 ・ 円/束</span></th>'
    +'<th class="tl">キー産出品</th><th>現在価格<br><span style="font-weight:400">円/束</span></th>'
    +'<th>分岐販売価格<br><span style="font-weight:400">円/束・以上で切OK</span></th><th>余裕</th>'
    +'<th>推奨カット<br><span style="font-weight:400">束</span></th><th class="tl">産出需給</th></tr></thead><tbody>';
  (d.patterns||[]).forEach(p=>{
    const vd=VD[p.verdict]||VD['○']; const f=p.floorPrice;
    h+='<tr>';
    h+='<td class="tl">'+esc(p.label)+'</td>';
    h+='<td class="tl"><span class="badge-sm" style="background:'+vd.c+'">'+esc(p.verdict)+'</span></td>';
    h+='<td><b style="color:'+(p.breakevenPerPiece>0?'var(--ok)':'var(--buy)')+'">'+(p.breakevenPerPiece>0?'':'−')+yen(Math.abs(p.breakevenPerPiece))+'</b> <span style="color:var(--sub)">/ '+yen(p.breakevenPerBundle)+'</span></td>';
    if(f){
      h+='<td class="tl">'+esc(f.label)+'<span class="plabel">'+esc(f.channel)+'</span></td>';
      h+='<td>'+yen(f.curBundle)+'</td>';
      h+='<td class="floor">'+(f.floorBundle<=0?'タダ同然でも得':yen(f.floorBundle)+'円〜')+'</td>';
      h+='<td class="mg" style="color:'+mgColor(f.marginPct)+'">'+(f.marginPct==null?'—':(f.marginPct>=0?'':'−')+Math.abs(f.marginPct)+'%')+'</td>';
    } else {
      h+='<td class="tl">—</td><td>—</td><td>—</td><td>—</td>';
    }
    h+='<td>'+(p.recommendCutBundles>0?('🪚'+yen(p.recommendCutBundles)):'—')+'</td>';
    h+='<td class="tl">'+(p.yields||[]).map(y=>esc(y.label)+' '+sttChip(y.status)).join('　')+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  // パターンカード
  h+='<div class="grid">';
  (d.patterns||[]).forEach(p=>{
    const vd=VD[p.verdict]||VD['○'];
    const cls=(p.verdict==='◎'||p.verdict==='○')?'v-good':(p.verdict==='×'?'v-bad':'');
    h+='<div class="pcard '+cls+'">';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
      +'<h3>'+esc(p.label)+'</h3>'
      +'<span class="badge" style="background:'+vd.c+'">'+vd.t+'</span></div>';
    // 損益分岐大表示
    h+='<div class="be"><span class="big" style="color:'+(p.breakevenPerPiece>0?'var(--ok)':'var(--buy)')+'">'
      +(p.breakevenPerPiece>0?'':'−')+yen(Math.abs(p.breakevenPerPiece))+'</span><span class="unit">円/枚（1カット）</span>'
      +'<span class="sub">＝ '+yen(p.breakevenPerBundle)+'円/元板束(8枚)</span></div>';
    h+='<div class="row"><span>成功率 <b>'+Math.round((p.successRate||0)*100)+'%</b></span>'
      +'<span>産出手取り期待 <b>'+yen(p.yieldExp)+'</b>円</span>'
      +'<span>元板評価 <b>'+yen(p.srcValue)+'</b>円（'+esc(p.srcValueMode)+'）</span></div>';
    if(p.laborPerPiece!=null){
      h+='<div class="row"><span>実手間賃 '+yen(p.laborPerPiece)+'円/枚 → 実損益 <b style="color:'+((p.actualProfit||0)>=0?'var(--ok)':'var(--buy)')+'">'+((p.actualProfit||0)>=0?'+':'−')+yen(Math.abs(p.actualProfit||0))+'円/枚</b></span></div>';
    }
    // 分岐販売価格（これ以上で売れるなら切ってOK）
    if(p.floorPrice){ const f=p.floorPrice;
      h+='<div class="floorline">💴 '+esc(f.label)+'が'
        +(f.floorBundle<=0?'<b>タダ同然でも切って得</b>':'束<b>'+yen(f.floorBundle)+'円</b>以上で売れるなら切ってOK')
        +'<span style="color:var(--sub);font-weight:600">（現在 '+yen(f.curBundle)+'円'+(f.marginPct==null?'':'・余裕<b style="color:'+mgColor(f.marginPct)+'">'+(f.marginPct>=0?'':'−')+Math.abs(f.marginPct)+'%</b>')+'）</span></div>';
    }
    // 産出需給
    h+='<div class="row">産出：'+(p.yields||[]).map(y=>esc(y.label)+' '+sttChip(y.status)).join('　')+'</div>';
    // 推奨カット
    if(p.recommendCutBundles>0){
      h+='<div class="row" style="color:var(--accent);font-weight:700">🪚 推奨カット目安 <b>'+yen(p.recommendCutBundles)+'束</b>'
        +(p.bottleneck?('（'+esc(p.bottleneck.label)+'の不足 '+yen(p.bottleneck.shortBundles)+'束を補う）'):'')+'</div>';
    }
    if(p.spotNote) h+='<div class="row" style="color:var(--sub)">💡 '+esc(p.spotNote)+'</div>';
    // 内訳アコーディオン
    h+='<details class="det"><summary>内訳（産出手取り − 元板評価）▼</summary>'
      +'<table class="yt"><thead><tr><th>産出規格</th><th>枚単価</th><th>手取り</th><th>×枚</th><th>小計</th></tr></thead><tbody>';
    (p.yields||[]).forEach(y=>{
      h+='<tr><td>'+esc(y.label)+(y.priceLabel?('<span class="plabel">'+esc(y.priceLabel)+'</span>'):'')+(y.note?(' <span style="color:var(--sub);font-size:10px">'+esc(y.note)+'</span>'):'')+'</td>'
        +'<td>'+yen(y.unit)+'</td><td>'+yen(y.net)+'</td><td>×'+y.pieces+'</td><td><b>'+yen(y.subtotal)+'</b></td></tr>';
    });
    h+='<tr><td colspan="4" style="color:var(--sub)">産出手取り合計（成功時）</td><td><b>'+yen(p.yieldSuccess)+'</b></td></tr>';
    if(p.yieldFail>0) h+='<tr><td colspan="4" style="color:var(--sub)">失敗時（成功率'+Math.round((p.successRate||0)*100)+'%で期待値に加味）</td><td>'+yen(p.yieldFail)+'</td></tr>';
    h+='<tr><td colspan="4" style="color:var(--sub)">− 元板評価（'+esc(p.srcValueMode)+'）</td><td>−'+yen(p.srcValue)+'</td></tr>';
    h+='<tr><td colspan="4" style="font-weight:800">＝ 損益分岐手間賃 / 枚</td><td style="font-weight:800;color:'+(p.breakevenPerPiece>0?'var(--ok)':'var(--buy)')+'">'+(p.breakevenPerPiece>0?'':'−')+yen(Math.abs(p.breakevenPerPiece))+'</td></tr>';
    h+='</tbody></table></details>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="note"><b>📎 計算方法と注意</b><ul>'+(d.notes||[]).map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>';
  document.getElementById('content').innerHTML=h;
}

// ===== 設定パネル =====
function renderCfgPanel(){
  const p=document.getElementById('cfgPanel');
  if(!CFG_OPEN){ p.style.display='none'; p.innerHTML=''; return; }
  const st=(KD&&KD.settings)||{}, fr=(st.feeRate)||{};
  let h='<div class="panel"><h2>⚙ 木取り設定</h2>';
  h+='<div class="fgrid">'
    +fInput('feeRate_市売','市売 手数料率',fr['市売'])
    +fInput('feeRate_付売','付売 手数料率',fr['付売'])
    +fInput('feeRate_EC','EC 手数料率',fr['EC'])
    +fInput('opp_weight','opp_weight（ok時の重み）',st.opp_weight)
    +fInput('over_ratio','over_ratio（積上がり判定）',st.over_ratio)
    +fInput('goodUplift','◎閾値（円/枚）',st.goodUplift)
    +fInput('okUplift','○ゆとり閾値（円/枚）',st.okUplift)
    +'</div>';
  h+='<div style="margin-top:10px"><button id="cfgSave" class="tbtn" style="background:var(--accent);border-color:var(--accent);color:#fff">💾 設定を保存</button> <span id="cfgMsg" style="font-size:12px;color:var(--sub)"></span></div>';
  // パターン編集（成功率・実手間賃のみ簡易編集＝現場で調整する頻度が高い項目）
  h+='<div class="pedit"><h2 style="font-size:13px;margin-bottom:8px">🪚 パターン（成功率・実手間賃を調整）</h2>';
  (KD&&KD.patterns||[]).forEach(p=>{
    h+='<div class="prow" data-id="'+esc(p.id)+'">'
      +'<span class="lbl">'+esc(p.label)+'</span>'
      +'<label style="font-size:11px;color:var(--sub)">成功率<input type="number" step="0.05" min="0" max="1" class="p-sr" value="'+(p.successRate)+'"></label>'
      +'<label style="font-size:11px;color:var(--sub)">実手間賃/枚<input type="number" step="10" class="p-lb" value="'+(p.laborPerPiece==null?'':p.laborPerPiece)+'" placeholder="未設定"></label>'
      +'<button class="tbtn p-save">保存</button></div>';
  });
  h+='<div style="font-size:11px;color:var(--sub);margin-top:6px">※ パターンの追加・産出規格の変更はスプシ「木取りパターン」シートで行えます（id/label/src/産出JSON…）。</div>';
  h+='</div></div>';
  p.innerHTML=h; p.style.display='block';
  document.getElementById('cfgSave').onclick=saveCfg;
  p.querySelectorAll('.p-save').forEach(b=>b.onclick=()=>savePattern(b.closest('.prow')));
}
function fInput(key,label,val){
  return '<label>'+esc(label)+'<input class="cfg-f" data-key="'+key+'" value="'+(val==null?'':val)+'"></label>';
}
async function post(body){
  const c=creds();
  const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify(Object.assign({action:'board',email:c.email,pass:c.pass},body))});
  return r.json();
}
async function saveCfg(){
  const kv={};
  document.querySelectorAll('.cfg-f').forEach(i=>{ const v=i.value.trim(); if(v!=='') kv[i.dataset.key]=Number(v); });
  const msg=document.getElementById('cfgMsg'); msg.textContent='保存中…';
  try{ const j=await post({kidoriConfig:{kv:kv}}); msg.textContent=j&&j.ok?('✅ 保存しました（'+j.saved+'件）'):('保存失敗: '+((j&&j.error)||'')); if(j&&j.ok) fetchKd(true).then(render); }
  catch(e){ msg.textContent='保存失敗: '+e.message; }
}
async function savePattern(rowEl){
  const id=rowEl.dataset.id;
  const sr=rowEl.querySelector('.p-sr').value.trim();
  const lb=rowEl.querySelector('.p-lb').value.trim();
  const btn=rowEl.querySelector('.p-save'); btn.textContent='保存中…';
  // patch=true: 成功率・実手間賃だけ差し替え（産出JSON等はサーバー既存行を温存）
  try{ const j=await post({kidoriPattern:{id:id, patch:true, successRate:sr===''?1:Number(sr), laborPerPiece:lb===''?'':Number(lb)}});
    btn.textContent=j&&j.ok?'✅':'失敗'; if(j&&j.ok) fetchKd(true).then(()=>{render();renderCfgPanel();}); }
  catch(e){ btn.textContent='失敗'; }
}

function loadCh(){
  markChSeg();
  KD=null;
  // キャッシュがあれば即表示し裏で更新（stale-while-revalidate）。裏更新失敗時もキャッシュ表示は消さない
  try{ const s=localStorage.getItem(chCacheKey()); if(s){ const j=JSON.parse(s); if(j&&j.patterns){ KD=j; render(); if(CFG_OPEN) renderCfgPanel(); } } }catch(e){}
  if(!KD){ document.getElementById('content').innerHTML='<div class="empty">読み込み中…</div>'; startLoadProgress(); }
  fetchKd(false).then(()=>{ stopLoadProgress(); render(); if(CFG_OPEN) renderCfgPanel(); })
    .catch(err=>{ stopLoadProgress(); if(!KD) document.getElementById('content').innerHTML='<div class="empty">取得に失敗しました: '+esc(err.message)+'<br>（🔄再計算で再試行）</div>'; });
}
function boot(){
  const c=creds();
  if(!c.email){ document.getElementById('content').innerHTML='<div class="empty">ログイン情報がありません。<br><a href="./">在庫ボード</a>でログイン（ログインを保持）してから開き直してください。</div>'; return; }
  loadCh();
}
document.querySelectorAll('.chbtn').forEach(b=>b.onclick=()=>{ CH=b.dataset.ch; try{localStorage.setItem(CH_KEY,CH);}catch(e){} loadCh(); });
document.getElementById('refreshBtn').onclick=()=>{ document.getElementById('content').innerHTML='<div class="empty">再計算中…</div>'; startLoadProgress(); fetchKd(true).then(()=>{stopLoadProgress();render();if(CFG_OPEN)renderCfgPanel();}).catch(err=>{ stopLoadProgress(); document.getElementById('content').innerHTML='<div class="empty">再計算に失敗: '+esc(err.message)+'<br>（🔄再計算で再試行）</div>'; }); };
document.getElementById('cfgBtn').onclick=()=>{ CFG_OPEN=!CFG_OPEN; renderCfgPanel(); };
boot();
</script>
</body>
