<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>適正在庫 | 林材木店</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235a7a3e'/><text x='51' y='46.5' font-size='68' text-anchor='middle' dominant-baseline='central' fill='%23ffffff' font-family='sans-serif' font-weight='bold'>適</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235a7a3e'/><text x='51' y='46.5' font-size='68' text-anchor='middle' dominant-baseline='central' fill='%23ffffff' font-family='sans-serif' font-weight='bold'>適</text></svg>">
<meta name="theme-color" content="#5a7a3e">
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#2c2a26; --sub:#7a756c; --line:#e3ddd0;
    --accent:#5a7a3e; --accent2:#7a9a55; --shadow:0 1px 3px rgba(60,45,25,.08),0 6px 20px rgba(60,45,25,.06);
    --buy:#c0392b; --buy-bg:rgba(192,57,43,.06); --warn:#b7791f; --ok:#1e8e4e; --pos:#1c66c4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1a17; --card:#26231f; --ink:#ece7dd; --sub:#9c958a; --line:#3a352e;
      --accent:#9dbb72; --accent2:#7a9a55; --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
      --buy:#e57368; --buy-bg:rgba(229,115,104,.10); --warn:#e0b25e; --ok:#7fce9e; --pos:#6fb1f5;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:0 0 60px}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
  .head-inner{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .logo{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;box-shadow:var(--shadow)}
  h1{font-size:17px;font-weight:800;line-height:1.2}
  .hsub{font-size:11px;color:var(--sub);margin-top:2px}
  .spacer{margin-left:auto}
  .tbtn{font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
  .tbtn:hover{border-color:var(--accent)}
  .winbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #upd{font-size:12px;color:var(--sub);font-weight:700}
  main{max-width:1400px;margin:0 auto;padding:16px 20px}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .card{flex:1;min-width:260px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow)}
  .card .l{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:4px}
  .card.buy{border-color:color-mix(in srgb,var(--buy) 45%,transparent);background:var(--buy-bg)}
  .tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
  th{position:sticky;top:0;background:var(--card);color:var(--sub);font-weight:700;text-align:right;padding:10px 10px;border-bottom:2px solid var(--line);font-size:12px}
  th:first-child, td:first-child{text-align:left}
  th.tl, td.tl{text-align:left}
  td{padding:9px 10px;text-align:right;border-top:1px solid var(--line)}
  tr.lenhead td{background:var(--bg);font-weight:800;color:var(--sub);font-size:12px;padding:6px 10px;text-align:left}
  tr.buyrow td{background:var(--buy-bg)}
  .bar{position:relative;width:150px;height:12px;border-radius:6px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
  .bar b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--sub);opacity:.7}
  .st{font-weight:800}
  .act{color:var(--sub);font-size:12px}
  .note{font-size:12px;color:var(--sub);margin:14px 2px;line-height:1.7}
  .note li{margin:3px 0 3px 18px}
  .empty{padding:50px 20px;text-align:center;color:var(--sub);font-weight:700}
  @media (max-width:700px){ .card{min-width:100%} th,td{padding:7px 7px} }
</style>
</head>
<body>
<header><div class="head-inner">
  <div class="logo">適</div>
  <div><h1>適正在庫</h1><div class="hsub">原板 A級標準120mm幅 ・ 長さ×等級の需給とスポット購入目安</div></div>
  <div class="spacer"></div>
  <span id="winSeg">
    <button class="tbtn winbtn" data-win="90">直近90日</button>
    <button class="tbtn winbtn" data-win="365">直近1年</button>
  </span>
  <span id="upd"></span>
  <button id="refreshBtn" class="tbtn">🔄 再計算</button>
  <a class="tbtn" href="./">← 在庫ボードへ</a>
</div></header>
<main>
  <div id="content"><div class="empty">読み込み中…</div></div>
</main>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxvPjDv81vrJMW2GaqpCJooyxxt7__gvMF4mJkmcGNbNS2xGMoXgTnn6_OEPZ3Rr0spdg/exec";
const CRED_KEY='hayazai_board_cred', TK_CACHE='hayazai_tekisei_cache', WIN_KEY='hayazai_tekisei_win';
function creds(){ try{ return JSON.parse(localStorage.getItem(CRED_KEY)||sessionStorage.getItem(CRED_KEY)||'{}'); }catch(e){ return {}; } }
function authQS(){ const c=creds(); return 'email='+encodeURIComponent(c.email||'')+'&pass='+encodeURIComponent(c.pass||''); }
let TK=null;
let WIN=Number(localStorage.getItem(WIN_KEY))||365;   // 集計期間（日）既定=直近1年
function winCacheKey(){ return TK_CACHE+'_'+WIN; }
function markWinSeg(){ document.querySelectorAll('.winbtn').forEach(b=>b.classList.toggle('on', Number(b.dataset.win)===WIN)); }
const TK_ST={ buy:{c:'var(--buy)',t:'🟥 要スポット購入'}, soon:{c:'var(--warn)',t:'🟧 まもなく不足'}, recover:{c:'var(--warn)',t:'🟨 カネ信で回復見込み'}, over:{c:'var(--warn)',t:'🟡 積み上がり注意'}, ok:{c:'var(--ok)',t:'✅ 充足'}, idle:{c:'var(--sub)',t:'― 動きなし'}, none:{c:'var(--sub)',t:'―'} };

async function fetchTk(force){
  const win=WIN;
  const r=await fetch(GAS_URL+'?api=tekisei&win='+win+'&'+authQS()+(force?'&fresh=1':''));
  const j=await r.json();
  if(win!==WIN) throw new Error('期間切替のため破棄');   // 応答待ちの間に切り替えられた
  if(j&&j.ok&&j.rows){ TK=j; try{localStorage.setItem(winCacheKey(),JSON.stringify(j));}catch(e){} return j; }
  throw new Error((j&&j.error)||'取得失敗');
}
function esc(s){ return String(s).replace(/</g,'&lt;'); }
function render(){
  const d=TK; if(!d) return;
  document.getElementById('upd').textContent='更新 '+(d.updated||'');
  markWinSeg();
  const st=d.settings||{}, s=d.summary||{};
  const w=d.window||{}; const reqW=w.req||st.windowDays||90;
  const winLabel=(reqW>=360)?'直近1年':('直近'+reqW+'日');
  const covTxt=[
    (w.ichibaEffDays&&w.ichibaEffDays<reqW)?('市場・付売データは'+(w.ichibaEarliest||'')+'以降の'+w.ichibaEffDays+'日分'):null,
    (w.ecEffDays&&w.ecEffDays<reqW)?('ECデータは'+(w.ecEarliest||'')+'以降の'+w.ecEffDays+'日分'):null
  ].filter(Boolean).join(' ／ ');
  let h='';
  // 前提＋サマリー
  h+='<div class="cards">';
  h+='<div class="card"><div class="l">⚙ 前提（運用モデル）</div>'
    +'<div style="font-size:13px;line-height:1.8"><b>カネ信は常時入荷で止めない</b>: '+(st.kaneshinMonthly||400)+'束/月・4mのみ<br>'
    +'等級配分: 丸節<b>80%</b> / 小節<b>10%</b> / 特上小<b>5%</b> / 無節<b>5%</b><br>'
    +'安全在庫 <b>'+(st.safetyDays||60)+'日分（≒'+(st.safetyWorkdays||40)+'稼働日）</b>・売れ行き集計 <b>'+winLabel+'</b><br>'
    +'需要・残日数は<b>月'+(st.workdaysPerMonth||20)+'日稼働の稼働日ベース</b></div>'
    +'<div style="font-size:11px;color:var(--sub);margin-top:4px">数値の変更は在庫スプシ「仕入判断」シート B2:B4'+(covTxt?('<br>⚠ '+covTxt+'しかないため、日販は実カバー日数で割っています'):'')+'</div></div>';
  if(s.buyCount){
    h+='<div class="card buy"><div class="l" style="color:var(--buy)">🛒 スポット購入の候補 '+s.buyCount+'規格 ・ 計 '+Number(s.buyBundles).toLocaleString()+'束</div>'
      +'<div style="font-size:13px;line-height:1.8">'+(s.buyList||[]).map(esc).join('<br>')+'</div>'
      +'<div style="font-size:11px;color:var(--sub);margin-top:4px">⚠印の規格は在庫データ未整備のため参考値（下の注意参照）</div></div>';
  }
  h+='</div>';
  // テーブル
  h+='<div class="tblwrap"><table><thead><tr>'
    +'<th class="tl">規格</th><th>現在庫(束)</th><th>'+winLabel+'実績</th><th title="月'+(st.workdaysPerMonth||20)+'日稼働換算">需要/稼働日</th><th title="月'+(st.workdaysPerMonth||20)+'日稼働換算">カネ信/稼働日</th><th>純増減/稼働日</th><th>残(稼働日)</th><th title="'+(st.safetyDays||60)+'暦日≒'+(st.safetyWorkdays||40)+'稼働日分">適正在庫</th><th>過不足</th><th class="tl">在庫÷適正</th><th class="tl">判定・アクション</th>'
    +'</tr></thead><tbody>';
  let lastLen=null;
  (d.rows||[]).forEach(r=>{
    if(r.length!==lastLen){
      lastLen=r.length;
      h+='<tr class="lenhead"><td colspan="11">▼ '+esc(r.lenLabel)+'</td></tr>';
      if(r.length===4000 && d.pool4m){
        const p=d.pool4m;
        h+='<tr><td colspan="11" class="tl" style="background:rgba(90,122,62,.08);border-left:3px solid var(--accent);font-size:12.5px;line-height:1.7;white-space:normal">'
          +'📦 <b style="font-size:14px">4m 丸節プール 推定 約 '+Number(p.estToday).toLocaleString()+'束</b>'
          +'（3/31実棚卸 '+Number(p.anchor1.bundles).toLocaleString()+'束 ＋ 入荷推定 '+Number(p.inflowSince).toLocaleString()+'束 − 出荷実績 '+Number(p.outflowSince).toLocaleString()+'束'+(p.ecSince?(' − EC '+p.ecSince+'束'):'')+'）'
          +(p.reservedBundles?('・加工引当 '+p.reservedBundles+'束 → 販売可能 約 <b>'+Number(p.estAvail).toLocaleString()+'束</b>'):'')
          +(p.poolDays!=null?('・丸節4m需要 '+p.demandDaily+'束/稼働日 → <b>残 約'+p.poolDays+'稼働日分</b>'):'')
          +'<br><span style="color:var(--sub)">プール=選別前の原板＋仕掛品＋加工品（丸節系）。入荷は前期(9/30→3/31)の実績から逆算した '+p.inflowRate+'束/日（カネ信＋スポット等ぜんぶ込み）を仮定。下の丸節行の「≈推定」はこの値です（1m/2m/3mの丸節も同方式）。</span></td></tr>';
      }
    }
    const ss=TK_ST[r.status]||TK_ST.none;
    const warn=(r.infinite&&!r.pooled)?' <span title="無限在庫（EC常時100送信）の規格。カネ信入荷が在庫セルに足されていないため、実際より少なく表示されている可能性が高い">⚠</span>':'';
    const stockCell=r.pooled
      ? '<span style="color:var(--accent)" title="棚卸(3/31)起点の推定値: 丸節プール（原板＋仕掛品＋加工品）を前期実績の入荷ペースと出荷実績でロールフォワード。在庫セルの値('+Number(r.cellStock||0).toLocaleString()+'束)は入荷未反映のため不使用">≈'+Number(r.stock).toLocaleString()+'<small style="font-size:10px;font-weight:700"> 推定</small></span>'
      : Number(r.stock).toLocaleString();
    const ratio=r.teki>0?Math.max(0,r.availBundles)/r.teki:null;   // 1.0=適正ちょうど（バーは2.0でフル）
    const barW=ratio==null?0:Math.min(1,ratio/2)*100;
    const barC=ratio==null?'var(--line)':(ratio<1?'var(--buy)':(ratio>2?'var(--warn)':'var(--ok)'));
    const netCol=r.net<0?'var(--buy)':'var(--pos)';
    h+='<tr class="'+(r.status==='buy'?'buyrow':'')+'">'
      +'<td class="tl" style="font-weight:800">'+esc(r.grade)+'</td>'
      +'<td style="font-weight:800">'+stockCell+warn+(r.reservedPieces?' <span style="color:var(--sub);font-size:11px" title="加工予定に引当済みの枚数">🔒'+r.reservedPieces+'枚</span>':'')+'</td>'
      +'<td><span title="市場・付売の出荷束数">市 '+Number(r.ichibaWin||0).toLocaleString()+'束</span> <span style="color:var(--sub)">/</span> <span title="EC販売（'+Number(r.ecPiecesWin||0).toLocaleString()+'枚）">EC '+Number(r.ecWin||0).toLocaleString()+'束</span></td>'
      +'<td style="font-weight:700">'+r.dTotal.toFixed(2)+'</td>'
      +'<td>'+(r.supply?('+'+r.supply.toFixed(2)):'—')+'</td>'
      +'<td style="color:'+netCol+';font-weight:700">'+(r.net>0?'+':'')+r.net.toFixed(2)+'</td>'
      +'<td>'+(r.daysLeft==null?'—':(r.daysLeft+'日'))+'</td>'
      +'<td>'+Number(r.teki).toLocaleString()+'</td>'
      +'<td style="font-weight:800;color:'+(r.diff<0?'var(--buy)':'var(--pos)')+'">'+(r.diff>0?'+':'')+Number(r.diff).toLocaleString()+'</td>'
      +'<td class="tl">'+(ratio==null?'<span style="color:var(--sub);font-size:11px">—</span>':'<span class="bar" title="現在庫 '+r.availBundles+'束 ÷ 適正 '+r.teki+'束 = '+(ratio*100).toFixed(0)+'%（中央線=適正100%）"><i style="width:'+barW.toFixed(0)+'%;background:'+barC+'"></i><b></b></span>')+'</td>'
      +'<td class="tl"><span class="st" style="color:'+ss.c+'">'+ss.t+'</span> <span class="act">'+esc(r.action)+'</span></td>'
      +'</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="note"><b>📎 計算方法と注意</b><ul>'+(d.notes||[]).map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>';
  document.getElementById('content').innerHTML=h;
}
function loadWin(){
  markWinSeg();
  TK=null;
  try{ const s=localStorage.getItem(winCacheKey()); if(s){ const j=JSON.parse(s); if(j&&j.rows){ TK=j; render(); } } }catch(e){}
  if(!TK) document.getElementById('content').innerHTML='<div class="empty">計算中…（初回は10〜30秒かかることがあります）</div>';
  fetchTk(false).then(render).catch(err=>{ if(!TK) document.getElementById('content').innerHTML='<div class="empty">取得に失敗しました: '+esc(err.message)+'<br>（🔄再計算で再試行）</div>'; });
}
function boot(){
  const c=creds();
  if(!c.email){ document.getElementById('content').innerHTML='<div class="empty">ログイン情報がありません。<br><a href="./">在庫ボード</a>でログイン（ログインを保持）してから開き直してください。</div>'; return; }
  loadWin();
}
document.querySelectorAll('.winbtn').forEach(b=>b.onclick=()=>{ WIN=Number(b.dataset.win)||365; try{localStorage.setItem(WIN_KEY,String(WIN));}catch(e){} loadWin(); });
document.getElementById('refreshBtn').onclick=()=>{ document.getElementById('content').innerHTML='<div class="empty">再計算中…</div>'; fetchTk(true).then(render).catch(err=>{ document.getElementById('content').innerHTML='<div class="empty">再計算に失敗: '+esc(err.message)+'</div>'; }); };
boot();
</script>
</body>
</html>
